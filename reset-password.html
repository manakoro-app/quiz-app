<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワード設定 | まなぼん！</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .auth-container {
            max-width: 420px;
            margin: 60px auto;
            padding: 24px;
        }

        .auth-card {
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fff;
        }

        .auth-card h1 {
            margin-top: 0;
        }

        .auth-description {
            margin-bottom: 20px;
            line-height: 1.7;
        }

        .auth-field {
            margin-bottom: 16px;
        }

        .auth-field label {
            display: block;
            margin-bottom: 6px;
        }

        .auth-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        .auth-card button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        .auth-message {
            margin-top: 16px;
            min-height: 1.5em;
        }

        .auth-link {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <main class="auth-container">
        <div class="auth-card">

            <h1 id="pageTitle">新しいパスワードを設定</h1>

            <p class="auth-description">
                招待または再設定のリンクから開いてください。新しいパスワードを入力します。
            </p>

            <div class="auth-field">
                <label for="newPassword">新しいパスワード</label>
                <input
                    type="password"
                    id="newPassword"
                    autocomplete="new-password"
                    required>
            </div>

            <div class="auth-field">
                <label for="confirmPassword">
                    新しいパスワード（確認）
                </label>
                <input
                    type="password"
                    id="confirmPassword"
                    autocomplete="new-password"
                    required>
            </div>

            <button id="updateBtn" type="button" disabled>
                パスワードを変更
            </button>

            <div id="message" class="auth-message"></div>

            <div class="auth-link">
                <a href="login.html">ログイン画面に戻る</a>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <script>
        // Supabaseの招待リンクは token_hash + type=invite で受け取る。
        // 既存のパスワード再設定リンクは Supabase JS が回復セッションを処理する。
        const updateBtn = document.getElementById("updateBtn");
        const message = document.getElementById("message");
        const pageTitle = document.getElementById("pageTitle");
        let ready = false;
        let busy = false;

        function showMessage(text) { message.textContent = text; }
        function enableForm() { ready = true; updateBtn.disabled = false; }

        async function initializePasswordPage() {
            updateBtn.disabled = true;
            showMessage("認証リンクを確認しています...");
            const params = new URLSearchParams(window.location.search);
            const tokenHash = params.get("token_hash");
            const type = params.get("type");
            const errorDescription = params.get("error_description");
            if (errorDescription) {
                showMessage("リンクを確認できませんでした。再度メールを送信してください。");
                return;
            }

            if (type === "invite" && tokenHash) {
                pageTitle.textContent = "招待アカウントのパスワード設定";
                const { error } = await supabaseClient.auth.verifyOtp({
                    token_hash: tokenHash, type: "invite"
                });
                if (error) {
                    showMessage("招待リンクが無効、または期限切れです。管理者に再招待を依頼してください。");
                    return;
                }
                // 一度使用したトークンをアドレスバーに残さない
                window.history.replaceState({}, "", window.location.pathname);
                enableForm();
                showMessage("新しいパスワードを設定してください。");
                return;
            }

            // 既存のパスワード再設定メール（type=recovery）に対応。
            // Supabase JSがURLハッシュを読み取ってセッションを作るため、
            // その完了を待ってからセッションを確認する。
            const hash = new URLSearchParams(window.location.hash.slice(1));
            const linkType = type || hash.get("type");
            const supportedLink = linkType === "recovery" || linkType === "invite";
            if (!supportedLink) {
                showMessage("招待メールまたはパスワード再設定メールのリンクから開いてください。");
                return;
            }
            pageTitle.textContent = linkType === "invite"
                ? "招待アカウントのパスワード設定"
                : "新しいパスワードを設定";
            const { data, error } = await supabaseClient.auth.getSession();
            if (error || !data.session) {
                showMessage("再設定リンクが無効、または期限切れです。もう一度再設定メールを送信してください。");
                return;
            }
            // アクセストークンをURLから消す（セッションはSDK側で保持）
            window.history.replaceState({}, "", window.location.pathname);
            enableForm();
            showMessage("新しいパスワードを設定してください。");
        }

        updateBtn.addEventListener("click", async () => {
            if (!ready || busy) return;
            const password = document.getElementById("newPassword").value;
            const confirm = document.getElementById("confirmPassword").value;
            if (!password || !confirm) return showMessage("パスワードを入力してください。");
            if (password !== confirm) return showMessage("パスワードが一致していません。");
            if (password.length < 12) return showMessage("パスワードは12文字以上を推奨します。12文字以上で入力してください。");
            busy = true;
            updateBtn.disabled = true;
            showMessage("パスワードを設定しています...");
            try {
                const { error } = await supabaseClient.auth.updateUser({ password });
                if (error) throw error;
                // 初回設定後はログイン画面へ。既存の別端末セッションには影響しない。
                await supabaseClient.auth.signOut({ scope: "local" });
                showMessage("設定が完了しました。ログイン画面からログインしてください。");
                updateBtn.textContent = "設定完了";
                ready = false;
            } catch (error) {
                console.error("Password update failed", error);
                showMessage("設定できませんでした。リンクの期限やパスワードの条件を確認してください。");
                updateBtn.disabled = false;
            } finally { busy = false; }
        });

        initializePasswordPage().catch(error => {
            console.error("Link validation failed", error);
            showMessage("認証リンクの確認に失敗しました。再度お試しください。");
        });
    </script>

</body>

</html>
