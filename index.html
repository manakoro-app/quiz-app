<!DOCTYPE html>
<html lang="ja" class="auth-checking">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>まなぼん！</title>

    <link
        rel="stylesheet"
        href="style.css">

	<style>
	    html.auth-checking body {
	        visibility: hidden;
	    }
        .choice-btn.selected-choice {
            outline: 3px solid #2563eb;
            background-color: #dbeafe;
        }
        #submitAnswerBtn {
            margin: 16px 0;
            padding: 12px 20px;
            width: 100%;
            cursor: pointer;
        }
        #submitAnswerBtn:disabled { opacity: .5; cursor: not-allowed; }
	
/* まなぼ：ログイン後ホーム専用。既存クイズ機能・JSは変更しない */
body.manakoro-home { background:linear-gradient(145deg,#edf6ff 0%,#f6faff 50%,#eaf3ff 100%); color:#19334f; min-height:100vh; }
.manakoro-home .manakoro-shell { max-width:1000px; padding:32px; border:1px solid #dce9f7; border-radius:24px; box-shadow:0 14px 50px rgba(33,91,150,.09); }
.manakoro-home #startScreen { display:flex; flex-direction:column; gap:22px; }
.manakoro-home .home-header { position:relative; margin:0; padding:30px 28px 26px; border-radius:20px; background:linear-gradient(120deg,#f0f8ff,#e4f2ff); border:1px solid #d8eafb; text-align:left; }
.manakoro-home .home-brand { display:flex; align-items:center; gap:12px; }
.manakoro-home .home-brand-mark { display:inline-flex; align-items:center; justify-content:center; width:42px; height:42px; border-radius:14px; background:#147fe2; color:white; font-size:26px; }
.manakoro-home .home-header h1 { margin:0; color:#1376c9; font-size:clamp(28px,4vw,36px); letter-spacing:.04em; }
.manakoro-home .home-header .subtitle { margin:10px 0 0 54px; color:#587b9e; font-size:14px; }
.manakoro-home #userArea { display:flex; justify-content:flex-end; align-items:center; gap:12px; flex-wrap:wrap; margin-top:20px !important; font-size:13px; color:#59738f; overflow-wrap:anywhere; }
.manakoro-home #logoutBtn { margin-left:0 !important; background:white; color:#236eaa; border:1px solid #c7def4; padding:9px 16px; font-size:13px; font-weight:700; }
.manakoro-home #logoutBtn:hover { background:#eaf5ff; }
.manakoro-home .home-panel { margin:0; padding:26px; border:1px solid #dfebf7; border-radius:20px; background:white; box-shadow:0 4px 18px rgba(29,90,147,.035); }
.manakoro-home .home-section-heading { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.manakoro-home .home-section-heading h2 { margin:3px 0 0; font-size:21px; color:#193b5d; }
.manakoro-home .home-eyebrow { font-size:10px; font-weight:800; letter-spacing:.15em; color:#4b9bdc; }
.manakoro-home .home-section-icon { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; color:#167ed8; background:#eaf5ff; font-size:22px; }
.manakoro-home .stats-grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.manakoro-home .stat-card { min-width:0; padding:19px 10px; border:1px solid #e1edfa; background:#f5faff; border-radius:14px; }
.manakoro-home .stat-title { color:#597b9b; margin-bottom:8px; font-size:13px; }
.manakoro-home .stat-value { color:#1179d1; font-size:clamp(21px,3vw,29px); }
.manakoro-home .filter-area { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:18px; row-gap:4px; }
.manakoro-home .filter-area > .home-section-heading { grid-column:1/-1; }
.manakoro-home .home-field { min-width:0; margin-bottom:14px; }
.manakoro-home .home-field label { margin-bottom:8px; color:#2d5072; font-size:14px; }
.manakoro-home .home-field select { min-height:46px; background:#f9fcff; border:1px solid #cbdff2; border-radius:10px; color:#274562; font-size:14px; }
.manakoro-home .home-field select:focus { outline:2px solid #88c2ff; outline-offset:1px; }
.manakoro-home .question-limit-note { color:#7890a6; font-size:12px; line-height:1.5; }
.manakoro-home .home-checkbox { margin:0 0 12px; padding:12px 14px; align-items:center; border:1px solid #dcebf8; border-radius:10px; background:#f7fbff; }
.manakoro-home .home-checkbox label { display:flex; align-items:center; gap:9px; font-size:14px; color:#355776; }
.manakoro-home .home-checkbox input { accent-color:#1684e8; width:17px; height:17px; }
.manakoro-home #startBtn { grid-column:1/-1; width:100%; min-height:54px; margin-top:12px; border-radius:12px; background:#0d82ea; color:white; font-size:17px; font-weight:800; box-shadow:0 7px 17px rgba(18,126,221,.17); }
.manakoro-home #startBtn:hover { background:#086fce; }
.manakoro-home .home-footer { margin-top:30px; text-align:center; color:#8aa1b7; }
.manakoro-home .home-footer hr { border:0; border-top:1px solid #e3edf7; margin-bottom:16px; }
@media(max-width:650px) { body.manakoro-home {padding:10px;} .manakoro-home .manakoro-shell {padding:14px; border-radius:18px;} .manakoro-home .home-header {padding:22px 18px;} .manakoro-home .home-header .subtitle {margin-left:0;} .manakoro-home #userArea {justify-content:flex-start;} .manakoro-home .home-panel {padding:18px;} .manakoro-home .stats-grid {grid-template-columns:repeat(2,minmax(0,1fr));} .manakoro-home .filter-area {grid-template-columns:1fr;} }

	</style>

<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#087eea">

</head>

<body class="manakoro-home">

    <div class="container manakoro-shell">

        <!-- ===================== -->
        <!-- スタート画面 -->
        <!-- ===================== -->

        <section id="startScreen">

            <header class="home-header">

                <div class="home-brand"><h1>まなぼん！</h1></div>

                <p class="subtitle">

                    今日もちょこっと、まなぼん！

                </p>

                <div id="userArea" style="margin-top: 12px;">
                    <span id="userEmail"></span>
                    <button id="logoutBtn" type="button" style="margin-left: 8px;">ログアウト</button>
                </div>

            </header>

            <!-- 学習統計 -->

            <section
                id="statsArea"
                class="stats-area home-panel">

                <div class="home-section-heading"><div><span class="home-eyebrow">YOUR PROGRESS</span><h2>学習統計</h2></div><span class="home-section-icon" aria-hidden="true">↗</span></div>

                <div class="stats-grid">

                    <div class="stat-card">

                        <div class="stat-title">
                            総回答数
                        </div>

                        <div
                            id="totalAnswer"
                            class="stat-value">

                            0

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            総正解数
                        </div>

                        <div
                            id="totalCorrect"
                            class="stat-value">

                            0

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            総不正解数
                        </div>

                        <div
                            id="totalIncorrect"
                            class="stat-value">

                            0

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            正答率
                        </div>

                        <div
                            id="accuracy"
                            class="stat-value">

                            0%

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            お気に入り
                        </div>

                        <div
                            id="favoriteCount"
                            class="stat-value">

                            0

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            苦手問題
                        </div>

                        <div
                            id="weakCount"
                            class="stat-value">

                            0

                        </div>

                    </div>

                </div>

            </section>

            <!-- 出題設定 -->

            <section class="filter-area home-panel">

                <div class="home-section-heading"><div><span class="home-eyebrow">START LEARNING</span><h2>出題設定</h2></div><span class="home-section-icon" aria-hidden="true">✎</span></div>

                <div class="filter-group home-field">

                    <label for="categoryFilter">
                        カテゴリ
                    </label>

                    <select id="categoryFilter">

                        <option value="">
                            すべて
                        </option>

                    </select>

                </div>

                <div class="filter-group home-field">

                    <label for="tagFilter">
                        サブカテゴリ
                    </label>

                    <select id="tagFilter" aria-label="サブカテゴリ">

                        <option value="">
                            すべて
                        </option>

                    </select>
                    <p class="question-limit-note">選択したカテゴリに登録されているサブカテゴリを表示します。</p>

                </div>

                <div class="filter-group home-field">

                    <label for="difficultyFilter">
                        難易度
                    </label>

                    <select id="difficultyFilter">

                        <option value="">
                            すべて
                        </option>

                        <option value="1">
                            ★1 初級
                        </option>

                        <option value="2">
                            ★2 初中級
                        </option>

                        <option value="3">
                            ★3 中級
                        </option>

                        <option value="4">
                            ★4 上級
                        </option>

                        <option value="5">
                            ★5 最難関
                        </option>

                    </select>

                </div>

                <div class="checkbox-area home-checkbox">

                    <label>

                        <input
                            type="checkbox"
                            id="favoriteOnly">

                        お気に入りのみ

                    </label>

                </div>

                <div class="checkbox-area home-checkbox">

                    <label>

                        <input
                            type="checkbox"
                            id="incorrectOnly">

                        苦手問題のみ

                    </label>

                </div>

                <div class="filter-group home-field">
                    <label for="questionLimit">出題数</label>
                    <select id="questionLimit">
                        <option value="5">5問</option>
                        <option value="10" selected>10問</option>
                        <option value="20">20問</option>
                        <option value="50">50問</option>
                        <option value="all">すべての問題</option>
                    </select>
                    <p class="question-limit-note">対象問題が指定数より少ない場合は、対象の全問題を出題します。</p>
                </div>

                <button id="startBtn" class="home-start-btn">

                    学習開始

                </button>

            </section>

        </section>

        <!-- ===================== -->
        <!-- クイズ画面 -->
        <!-- ===================== -->

        <section
            id="quizScreen"
            style="display:none;">

            <div class="quiz-header">

                <div
                    id="category"
                    class="category">

                    カテゴリ

                </div>

                <div
                    id="difficulty"
                    class="difficulty">

                    難易度

                </div>

            </div>

            <div
                id="questionCounter"
                class="question-counter">

                0 / 0

            </div>

            <div
                id="totalQuestionCount"
                class="question-count">

                登録問題数 : 0問

            </div>

            <h2
                id="question"
                class="question">

                問題文

            </h2>

            <div
                id="choices"
                class="choices">

            </div>

            <button id="submitAnswerBtn" type="button" style="display:none;">
                回答する
            </button>

            <div
                id="result"
                class="result">

            </div>

            <div
                id="explanation"
                class="explanation">

            </div>

            <div class="button-group">

                <button id="favoriteBtn">

                    ☆ お気に入り

                </button>

                <button id="nextBtn">

                    次の問題

                </button>

                <button id="finishEarlyBtn" type="button">
                    学習を途中終了
                </button>

            </div>

        </section>

        <!-- ===================== -->
        <!-- 終了画面 -->
        <!-- ===================== -->

        <section
            id="finishScreen"
            style="display:none;">

            <h2>

                学習完了！お疲れさまでした！

            </h2>

            <div
                id="finishResult">

            </div>

            <button
                id="restartBtn">

                もう一度学習する

            </button>

            <button
                id="returnHomeBtn">

                スタート画面へ戻る

            </button>

        </section>

        <!-- フッター -->

        <footer class="home-footer">

            <hr>

            <small>

                Personal Quiz System

            </small>

        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="auth.js"></script>

    <script src="questions.js"></script>

    <script src="script.js"></script>

</body>

</html>
