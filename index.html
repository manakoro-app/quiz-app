<!DOCTYPE html>
<html lang="ja" class="auth-checking">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>まなころ!</title>
    <!-- 標準のSupabase招待メールはSite URLに戻るため、招待時だけ設定画面へ転送 -->
    <script>
      (function () {
        const hash = new URLSearchParams(window.location.hash.slice(1));
        const query = new URLSearchParams(window.location.search);
        const isInvite = hash.get("type") === "invite" || query.get("type") === "invite";
        if (!isInvite) return;
        // 認証情報を含むURLをそのまま引き継ぐ（クエリとハッシュを保持）
        window.location.replace("reset-password.html" + window.location.search + window.location.hash);
      })();
    </script>


    <link
        rel="stylesheet"
        href="style.css">

	<style>
	    html.auth-checking body {
	        visibility: hidden;
	    }
        .choice-btn.selected-choice {
            outline: 3px solid #2563eb;
            background-color: #dbeafe;
        }
        #submitAnswerBtn {
            margin: 16px 0;
            padding: 12px 20px;
            width: 100%;
            cursor: pointer;
        }
        #submitAnswerBtn:disabled { opacity: .5; cursor: not-allowed; }
	</style>

<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#087eea">

</head>

<body>

    <div class="container">

        <!-- ===================== -->
        <!-- スタート画面 -->
        <!-- ===================== -->

        <section id="startScreen">

            <header>

                <h1>まなころ!</h1>

                <p class="subtitle">

                    ころんとひと問、ちょこっと成長。

                </p>

                <div id="userArea" style="margin-top: 12px;">
                    <span id="userEmail"></span>
                    <button id="logoutBtn" type="button" style="margin-left: 8px;">ログアウト</button>
                </div>

            </header>

            <!-- 学習統計 -->

            <section
                id="statsArea"
                class="stats-area">

                <h2>学習統計</h2>

                <div class="stats-grid">

                    <div class="stat-card">

                        <div class="stat-title">
                            総回答数
                        </div>

                        <div
                            id="totalAnswer"
                            class="stat-value">

                            0

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            総正解数
                        </div>

                        <div
                            id="totalCorrect"
                            class="stat-value">

                            0

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            総不正解数
                        </div>

                        <div
                            id="totalIncorrect"
                            class="stat-value">

                            0

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            正答率
                        </div>

                        <div
                            id="accuracy"
                            class="stat-value">

                            0%

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            お気に入り
                        </div>

                        <div
                            id="favoriteCount"
                            class="stat-value">

                            0

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-title">
                            苦手問題
                        </div>

                        <div
                            id="weakCount"
                            class="stat-value">

                            0

                        </div>

                    </div>

                </div>

            </section>

            <!-- 出題設定 -->

            <section class="filter-area">

                <h2>
                    出題設定
                </h2>

                <div class="filter-group">

                    <label for="categoryFilter">
                        カテゴリ
                    </label>

                    <select id="categoryFilter">

                        <option value="">
                            すべて
                        </option>

                    </select>

                </div>

                <div class="filter-group">

                    <label for="tagFilter">
                        サブカテゴリ
                    </label>

                    <select id="tagFilter" aria-label="サブカテゴリ">

                        <option value="">
                            すべて
                        </option>

                    </select>
                    <p class="question-limit-note">選択したカテゴリに登録されているサブカテゴリを表示します。</p>

                </div>

                <div class="filter-group">

                    <label for="difficultyFilter">
                        難易度
                    </label>

                    <select id="difficultyFilter">

                        <option value="">
                            すべて
                        </option>

                        <option value="1">
                            ★1 初級
                        </option>

                        <option value="2">
                            ★2 初中級
                        </option>

                        <option value="3">
                            ★3 中級
                        </option>

                        <option value="4">
                            ★4 上級
                        </option>

                        <option value="5">
                            ★5 最難関
                        </option>

                    </select>

                </div>

                <div class="checkbox-area">

                    <label>

                        <input
                            type="checkbox"
                            id="favoriteOnly">

                        お気に入りのみ

                    </label>

                </div>

                <div class="checkbox-area">

                    <label>

                        <input
                            type="checkbox"
                            id="incorrectOnly">

                        苦手問題のみ

                    </label>

                </div>

                <div class="filter-group">
                    <label for="questionLimit">出題数</label>
                    <select id="questionLimit">
                        <option value="5">5問</option>
                        <option value="10" selected>10問</option>
                        <option value="20">20問</option>
                        <option value="50">50問</option>
                        <option value="all">すべての問題</option>
                    </select>
                    <p class="question-limit-note">対象問題が指定数より少ない場合は、対象の全問題を出題します。</p>
                </div>

                <button id="startBtn">

                    学習開始

                </button>

            </section>

        </section>

        <!-- ===================== -->
        <!-- クイズ画面 -->
        <!-- ===================== -->

        <section
            id="quizScreen"
            style="display:none;">

            <div class="quiz-header">

                <div
                    id="category"
                    class="category">

                    カテゴリ

                </div>

                <div
                    id="difficulty"
                    class="difficulty">

                    難易度

                </div>

            </div>

            <div
                id="questionCounter"
                class="question-counter">

                0 / 0

            </div>

            <div
                id="totalQuestionCount"
                class="question-count">

                登録問題数 : 0問

            </div>

            <h2
                id="question"
                class="question">

                問題文

            </h2>

            <div
                id="choices"
                class="choices">

            </div>

            <button id="submitAnswerBtn" type="button" style="display:none;">
                回答する
            </button>

            <div
                id="result"
                class="result">

            </div>

            <div
                id="explanation"
                class="explanation">

            </div>

            <div class="button-group">

                <button id="favoriteBtn">

                    ☆ お気に入り

                </button>

                <button id="nextBtn">

                    次の問題

                </button>

                <button id="finishEarlyBtn" type="button">
                    学習を途中終了
                </button>

            </div>

        </section>

        <!-- ===================== -->
        <!-- 終了画面 -->
        <!-- ===================== -->

        <section
            id="finishScreen"
            style="display:none;">

            <h2>

                学習完了！お疲れさまでした！

            </h2>

            <div
                id="finishResult">

            </div>

            <button
                id="restartBtn">

                もう一度学習する

            </button>

            <button
                id="returnHomeBtn">

                スタート画面へ戻る

            </button>

        </section>

        <!-- フッター -->

        <footer>

            <hr>

            <small>

                Personal Quiz System

            </small>

        </footer>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="auth.js"></script>

    <script src="questions.js"></script>

    <script src="script.js"></script>

</body>

</html>
